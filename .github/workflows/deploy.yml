name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  AWS_REGION: us-east-1

# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID

permissions:
  id-token: write
  contents: read

jobs:
  # ─── Run tests inline ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pydantic pytest hypothesis
      - run: cd services/parser-metrics && python -m pytest tests/ -v

  # ─── Deploy Infrastructure ──────────────────────────────────
  deploy-infra:
    runs-on: ubuntu-latest
    needs: [test]
    # Skips instead of failing the run when AWS credentials aren't configured.
    if: ${{ vars.DEPLOY_INFRA == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK
        working-directory: infra/cdk
        run: |
          npm install
          # Remove file: reference that doesn't resolve in CI
          sed -i 's|"file:../../packages/contracts"|"*"|g' package.json
          npm install --ignore-scripts

      - name: CDK Bootstrap (if needed)
        working-directory: infra/cdk
        run: npx cdk bootstrap --force aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} 2>&1 || true
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: CDK Deploy
        working-directory: infra/cdk
        run: npx cdk deploy --all --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  # ─── Deploy Frontend to Vercel ──────────────────────────────
  # Requires secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, VITE_GROQ_KEY
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Verify PPTX export
        working-directory: apps/web
        run: node scripts/verify-pptx.mjs

      - name: Verify edit guardrails
        working-directory: apps/web
        run: node scripts/verify-guardrails.mjs

      - name: Verify truncated JSON recovery
        working-directory: apps/web
        run: node scripts/verify-json-repair.mjs

      - name: Verify page budget normalisation
        working-directory: apps/web
        run: node scripts/verify-page-budget.mjs

      - name: Verify IME Enter handling
        working-directory: apps/web
        run: node scripts/verify-ime.mjs

      - name: Regression suite
        working-directory: apps/web
        run: node test-regression.mjs

      - name: Build
        working-directory: apps/web
        env:
          VITE_OPENCODE_KEY: ${{ secrets.VITE_OPENCODE_KEY }}
          VITE_GROQ_KEY: ${{ secrets.VITE_GROQ_KEY }}
        run: npm run build

      - name: Bundle template backgrounds
        working-directory: apps/web
        run: cp -r public/template-slides dist/

      # Deploying needs VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
      # Without them the job still proves the build and test suites pass.
      - name: Check Vercel credentials
        id: vercel_creds
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping deploy. Build and tests passed."
          fi

      - name: Deploy to Vercel
        if: steps.vercel_creds.outputs.available == 'true'
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
