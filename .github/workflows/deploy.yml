name: Deploy Workshop Foundation

on:
  workflow_dispatch:
    inputs:
      deployment_confirmation:
        description: "Enter DEPLOY_WORKSHOP_FOUNDATION to request the protected foundation deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: workshop-foundation-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  AWS_REGION: us-east-1
  WORKSHOP_ACCOUNT_ID: "450567357211"

jobs:
  validate-foundation:
    name: Validate private foundation
    runs-on: ubuntu-latest
    environment: workshop-foundation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Require Workshop OIDC configuration
        env:
          ROLE_ARN: ${{ vars.AWS_WORKSHOP_DEPLOY_ROLE_ARN }}
        run: |
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::450567357211:role/ ]]; then
            echo "AWS_WORKSHOP_DEPLOY_ROLE_ARN must name a role in Workshop account 450567357211."
            exit 1
          fi

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKSHOP_DEPLOY_ROLE_ARN }}
          role-session-name: workshop-cdk-validate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.WORKSHOP_ACCOUNT_ID }}

      - name: Verify authenticated Workshop account
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "$WORKSHOP_ACCOUNT_ID"

      - name: Install locked CDK dependencies
        working-directory: infra/cdk
        run: npm ci --ignore-scripts

      - name: Type check and test CDK foundation
        working-directory: infra/cdk
        run: |
          npm run typecheck
          npm test

      - name: Synthesize the fail-closed foundation
        working-directory: infra/cdk
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.WORKSHOP_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: ./node_modules/.bin/cdk synth --output cdk.out

      - name: Upload synthesized templates
        uses: actions/upload-artifact@v4
        with:
          name: workshop-foundation-cdk-assembly
          path: infra/cdk/cdk.out/
          if-no-files-found: error

  deploy-foundation:
    name: Deploy approved foundation
    needs: validate-foundation
    if: ${{ inputs.deployment_confirmation == 'DEPLOY_WORKSHOP_FOUNDATION' }}
    runs-on: ubuntu-latest
    environment: workshop-foundation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WORKSHOP_DEPLOY_ROLE_ARN }}
          role-session-name: workshop-cdk-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.WORKSHOP_ACCOUNT_ID }}

      - name: Verify authenticated Workshop account
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "$WORKSHOP_ACCOUNT_ID"

      - name: Install locked CDK dependencies
        working-directory: infra/cdk
        run: npm ci --ignore-scripts

      - name: Deploy the approved fail-closed foundation
        working-directory: infra/cdk
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.WORKSHOP_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: ./node_modules/.bin/cdk deploy --all --require-approval never
