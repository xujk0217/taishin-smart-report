name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  AWS_REGION: us-east-1

# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID

permissions:
  id-token: write
  contents: read

jobs:
  # ─── Run tests inline ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pydantic pytest hypothesis
      - run: cd services/parser-metrics && python -m pytest tests/ -v

  # ─── Deploy Infrastructure ──────────────────────────────────
  deploy-infra:
    runs-on: ubuntu-latest
    needs: [test]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK
        working-directory: infra/cdk
        run: npm install

      - name: CDK Deploy
        working-directory: infra/cdk
        run: npx cdk deploy --all --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  # ─── Deploy Frontend ────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install & Build Frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build

      # Amplify Hosting handles deployment via git push
      # Or use S3 + CloudFront for static hosting:
      - name: Deploy to S3 (fallback)
        working-directory: apps/web
        run: |
          echo "Frontend build complete. Deploy via Amplify Hosting or:"
          echo "  aws s3 sync dist/ s3://your-frontend-bucket --delete"
          echo "  aws cloudfront create-invalidation --distribution-id YOUR_DIST_ID --paths '/*'"
