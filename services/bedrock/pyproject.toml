[tool.poetry]
name = "bedrock-lenses"
version = "0.1.0"
description = "Bedrock Converse client, Skill Registry, 3 Insight Lenses, Synthesizer, Critic"
authors = ["team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.8.0"
boto3 = "^1.34.0"
jsonschema = "^4.23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
hypothesis = "^6.108.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
