[tool.poetry]
name = "parser-metrics"
version = "0.1.0"
description = "Excel Parser, Normalizer, Formula Plan Builder, Metric Engine"
authors = ["team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
openpyxl = "^3.1.0"
pydantic = "^2.8.0"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
hypothesis = "^6.108.0"
moto = {version = "^5.0.0", extras = ["s3", "dynamodb"]}
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
